# Thresholds for the validation checks.
#
# Every value here is data, not code: fitted against a corpus, dated, and
# recorded with the sample it was fitted on.  `fitted: no` means the value is a
# starting guess and has not yet been measured.
version: 1

# --- C0: PSR trust and page routing --------------------------------------
c0:
  # C0-01 no text layer at all
  min_chars: 1
  # C0-02 a text layer too thin to be the page's real content
  sparse_max_lines: 5
  sparse_min_ink: 0.15
  # C0-03 text painted invisibly or in the background colour
  invisible_frac: 0.30
  # C0-04 an OCR layer sitting under a full-page scan
  ocr_lines_in_image: 0.60
  ocr_image_area: 0.50
  # C0-06 characters that decoded to nothing usable
  undecodable_frac: 0.20
  # C0-07 one "line" per glyph: broken font subsetting
  frag_max_chars_per_span: 1
  frag_min_spans: 200
  # C0-10 text converted to vector outlines: dense vector ink, almost no glyphs
  outline_vector_ink: 0.20
  outline_max_glyph: 0.05
  # C0-08 text direction.  Decided per DOCUMENT, not per page: a statistical
  # table page inside an Arabic report is 8% Arabic characters and still reads
  # right to left.  Fitted on 895 pages / 28 documents -- the corpus separates
  # at 0.000 vs >=0.181 aggregate, so 0.05 sits in a wide empty gap.
  rtl_frac: 0.20              # page-level, diagnostic only
  doc_rtl_aggregate: 0.05     # share of all characters in the document
  doc_rtl_max_page: 0.50      # or any single page this Arabic
  doc_min_chars: 200          # below this the document cannot vote; direction unknown
  # C0-09 glyphs drawn outside the visible area
  clipped_frac: 0.05

# --- Tier 1: what blocks a page ------------------------------------------
#
# Fitted on 29 benchmark pages x 53 systems (1,546 pairs) against the PSR
# reference layout, at roughly the 75th percentile of the twelve leading
# systems.  That places a page relative to what the corpus actually produces
# and keeps the escalation rate near the 12-20% budget.
#
# It does NOT establish a false-accept rate: without annotated pages there is
# nothing to be wrong against.  These are holding values, to be refitted for
# precision at 80% recall of consequential errors the moment gold data exists.
#
# Grouping precision and order tau are deliberately absent.  Both compare
# against a heuristic reference and both largely measure granularity, so they
# are recorded as features and never block.
compare:
  orphan_rate: 0.12               # share of glyph lines in no region at all
  cross_merge_rate: 0.25          # grouped line pairs spanning a column, table or figure boundary
  bucket_move_rate: 0.35          # of lines the reference can vouch for, share sent to the wrong store
  excess_band_transitions: 2
  order_inversions: 2
  # C4-07 compares against the order the PDF's own geometry implies.  It is the
  # only order check that survives on a single-column page.
  order_tau: 0.90
  # order invariants: valid on their own terms, no reference and no
  # model-supplied order needed, so they cover the systems that emit none
  contiguity_min_lines: 6
  contiguity_slack: 0.25
  backward_jumps: 3
  rtl_row_min_pairs: 3
  rtl_row_wrong: 0.5

  # C8 document consistency: a page judged against the rest of its own document
  doc_min_pages: 5
  running_rate: 0.8
  # covers and section title pages carry no running furniture by design
  doc_body_lines: 20
  region_z: 4.0
  font_shift: 0.4      # column changes beyond what the page structure allows

# --- Decision policy ------------------------------------------------------
#
# What the pipeline does about a defect, as opposed to what the defect is.  The
# checks measure the same thing under every setting here; only the consequence
# changes, so this is the block to edit when the downstream changes and the one
# to leave alone when a check is wrong.
policy:
  # Does the downstream keep DISCARD-bucket regions where a reviewer can pull
  # them back, or drop them at write time?  Under `archive`, mislabelling a
  # paragraph as a running header costs a retrieval miss until someone recovers
  # it; under `drop` the text is gone.  Same defect, different severity.
  discard: archive
  severity:
    archive:
      C6-05: MAJOR
      C6-06: MAJOR
    drop: {}

  # A page whose text layer cannot be trusted at all -- a scan, or born-digital
  # text converted to vector outlines.  `defer` parks it for the scanned path,
  # which does not exist yet; `escalate` sends it to a human instead.  Deferring
  # is right only while scanned pages are out of scope.
  unusable: defer

  # The random audit: a fixed share of ACCEPTED pages goes to a reviewer anyway.
  # This is the only source of an unbiased error estimate, because every other
  # label comes from a page that failed a check.  Never lower the rate to clear
  # a backlog -- a sample that flexes with load is not a sample.  The seed fixes
  # membership: a page's selection depends only on its id, the system and this
  # number, so the stratum stays valid as the corpus grows.
  audit:
    rate: 0.015
    seed: 20260904

  # The scorecard decides nothing until its weights mean something.  Both null
  # means the deterministic veto is the only thing that can escalate a page.
  risk:
    escalate: null
    reject: null

  # Invented.  Not fitted, not calibrated, and deliberately not load-bearing:
  # they order the review queue and nothing else.
  weights:
    severity:
      MAJOR: 0.25
      ADV: 0.05
    unverifiable: 0.15
    orphan_rate: 1.0
    cross_merge_rate: 0.6
    bucket_move_rate: 0.4

  tasks:
    C1: E1
    C2: E2
    C3: E2
    C4: E3
    C5: E2
    C6: E4
    C7: E6
    C8: E6
  task_order: [E1, E2, E3, E4, E6]

# --- C1-C8: the deterministic checks -------------------------------------
#
# Fitted on a uniform random sample of 120 pages (seed 7) from 35 documents,
# scored against 3 systems = 360 (system, page) pairs.  Random rather than
# stratified on purpose: the benchmark's 29 pages were chosen to be hard, so
# rates measured there describe the hard end of the corpus, not the corpus.
#
# As with the compare thresholds these bound the escalation rate, they do not
# establish a false-accept rate.  That needs annotated pages.
#
# Verification status, from rendering findings and looking at them.  Every check
# here was rendered through `validation.inspect`, which routes pages the same way
# the pipeline does -- an earlier version of that tool did not, and showed
# findings the pipeline would never emit.
#
#   verified, real                    C1-03 C1-04 C4-07 C4-08
#   rebuilt on reading lines          C1-01 C1-02 C1-03 C1-04 C1-05 C1-06
#   verified, false positives fixed   C1-02 C1-07 C2-01 C4-02 C5-01 C5-03
#                                     C6-01 C6-05 C6-06
#   verified, demoted to advisory     C2-06 C3-01 C4-09 C6-03 C7-05
#   demoted after the order control below            C4-10 (to MAJOR)
#   fires zero times after fixing the column bands   C3-02 C4-03 C7-01 C7-04
#   verified, guarded after review    C8-01
#   page-novelty signals, not findings about a prediction: they read the PDF
#   and never look at the model's output, so both are advisory   C8-02 C8-06
#   rendered but not yet reviewed     C1-05 C3-05 C4-09 C8-03 C8-05
#   specified but never implemented   none.  C6-04 is the same check as C1-07
#                                     and is deliberately not duplicated.
#
# Known upstream defect, unfixed on purpose: `core.reference` collects a table
# with shaded cell fills as a graphic area, moving its text out of the body
# lines that `core.metrics` scores recall against -- 6-8% of glyph lines, on
# 9-34% of pages.  Neither text density nor vector shape separates a shaded
# table from a chart (see validation/tables.py), so the fix needs annotated
# examples rather than another threshold.  Validation compensates locally.
#
# The C8 family needs several pages of one document, so it is inert on a
# workspace that samples pages: measured on three whole documents (92 pages,
# 4 systems) rather than on the random page sample.
#
# The coverage family was scored against the wrong unit until the reading-line
# rebuild.  Two defects in the reference, not in any model:
#
#   PyMuPDF's line grouping is one box per glyph on much of this corpus.  44% of
#   all body lines are taller than wide, which no horizontal text line is, and
#   one page carries 58 "lines" holding 225 characters.  The median page's boxes
#   are about twice as fine as its lines.  A finding then read "a block of 36
#   consecutive text lines was missed" when what was missed was 36 glyphs of a
#   vertical label in the margin.
#
#   Half of everything the family called lost content held no visible character
#   at all: 51% of the orphan lines on the sample contained only spaces.  A model
#   is right to emit no region for a space.
#
# Both are fixed at the right layer.  `validation/lines.py` rebuilds reading
# lines for the checks to score against; the PSR keeps `text_lines` exactly as
# the file states them and gains `blank_line_idx`, which is purely additive --
# every pre-existing field rebuilds byte-identical.
#
# Effect on the random sample, per check, before -> after:
#
#   C1-01  0.7% -> 0.0%    (grouped behind C1-04; fires on 81% under total loss)
#   C1-02  0.2% -> 0.2%
#   C1-03 17.0% -> 2.1%    the largest single driver of escalation
#   C1-04 10.1% -> 3.1%
#   C1-05  0.9% -> 0.9%
#   C1-06  9.9% -> 0.0%    was entirely fragmentation
#
#   block rate, best system   36.7% -> 15.8%
#   escalation, best system   34.2% -> 15.8%, inside the 12-20% budget
#
# None of that came from loosening a threshold.  The counts were in fact
# tightened, because they had been fitted in boxes and are now read in lines.
# The family was then checked for the opposite failure -- going quiet -- by
# deleting regions at random and confirming it still fires:
#
#   regions deleted    0%   10%   25%   50%   75%   100%
#   pages blocked      8%   11%   30%   54%   75%    85%
#
# The order invariants were run against the PSR reference layout as a control:
# regions taken straight from the PDF's geometry, where an invariant violation
# can only be the pipeline's own derivation.  On 98 pages of the random sample,
# fire rate on a model against fire rate on that reference --
#
#   C4-08   13.3%  vs   3.1%   attributable to the layout, stays blocking
#                                 (11.2% vs 2.0% after the reading-line rebuild:
#                                  the separation holds in either unit)
#   C4-09    9.2%  vs  16.3%   fires more on correct regions, demoted to ADV
#   C4-10    3.1%  vs   4.1%   inconclusive, demoted to MAJOR
#
# The control also found a real defect in `assemble.derive_order`: it sorted
# regions by left edge on right-to-left pages, so side-by-side blocks came out
# mirrored, and it sorted rows on exact top edge, so a point of jitter between
# two cells of one row discarded the direction key entirely.  Fixing both took
# C4-10 on the reference from 18.4% to 4.1%.  On a corpus where no model emits a
# reading order that function *is* the pipeline's reading order, so this was a
# defect in the product path and not only in a measurement.
#
# Reading order is only checkable where the model supplies one.  Of the four
# systems measured on the random sample, none does, so C4-07 is n/a on 100% of
# that workspace; on benchmark systems that do emit an order it fires on 37% and
# its findings are real -- paths that zig-zag between two columns of an Arabic
# page.  Where a model emits no order the pipeline derives one, and validating
# our own derivation needs annotated pages, not a check.
#
# Eighteen checks were examined by rendering their findings.  Four were right;
# fourteen were wrong, of which ten were repaired and four demoted.  The four
# demoted ones stay as features and must never gate a page.
checks:
  # C1 coverage.  Margin lines are excluded: content in the top/bottom 8% is
  # running furniture the pipeline discards anyway, and it was 22% of all
  # uncovered lines.
  margin_band: 0.08
  # a rate needs a floor on what was actually lost: a page whose text is all
  # inside ruled tables can have two body lines, and missing both read as 100%
  # lost.  Guarding on the size of the body set instead suppressed the real
  # findings, since dense table pages have few body lines by construction.
  #
  # Every count below is in RECONSTRUCTED READING LINES, not in the reference's
  # boxes.  The two differ by about a factor of two on the median page of this
  # corpus (validation/lines.py), so these were halved when coverage moved onto
  # lines; a count fitted in one unit and read in the other is how a check goes
  # quiet without anyone noticing.
  coverage_min_lost: 4
  orphan_line_rate: 0.12
  orphan_area_rate: 0.12
  orphan_cluster: 3
  orphan_in_column_rate: 0.12
  orphan_column_min_lines: 10
  # C1-05: a page with at least this many reading lines and no text region at all
  min_text_lines: 10
  footnote_band: 0.12
  footnote_lines: 4
  graphic_miss_area: 0.02
  graphic_miss_count: 2

  # C2 boundaries
  line_cut_rate: 0.15
  # a cut is horizontal: area coverage cannot separate a real split from
  # diacritics overflowing a correct boundary
  cut_min: 0.15
  cut_max: 0.85

  # C3 columns
  gutter_cover: 0.6
  band_span: 0.2
  band_imbalance: 0.85

  # C4-11 reads the words, so it only means anything where there are words.
  # Measured on 994 corpus pages choosing a true order over a shuffled one: 94%
  # on pages with prose, 80% on table-like pages, 85% overall.  Advisory at any
  # of those rates -- see docs/validation-experiments.md, E5.
  lm_min_lines: 12
  lm_min_prose: 0.15
  lm_margin: 0.5

  # C4 order.  contiguity_min_lines counts RECONSTRUCTED READING LINES, like the
  # C1 counts above: C4-08 measured spans in the reference's glyph boxes until
  # the rebuild and reported "a table of 17 lines read with 171 lines spliced
  # into it" on a page holding nothing like 171 lines.  Rate 13.9% -> 12.0%; the
  # criterion is a ratio, so unlike the coverage family it was mostly
  # scale-invariant, and what the fix repaired was the number a reviewer reads.
  excess_band_transitions: 2
  order_inversions: 2
  # C4-07 compares against the order the PDF's own geometry implies.  It is the
  # only order check that survives on a single-column page.
  order_tau: 0.90
  # order invariants: valid on their own terms, no reference and no
  # model-supplied order needed, so they cover the systems that emit none
  contiguity_min_lines: 6
  contiguity_slack: 0.25
  backward_jumps: 3
  rtl_row_min_pairs: 3
  rtl_row_wrong: 0.5

  # C8 document consistency: a page judged against the rest of its own document
  doc_min_pages: 5
  running_rate: 0.8
  # covers and section title pages carry no running furniture by design
  doc_body_lines: 20
  region_z: 4.0
  font_shift: 0.4

  # C5 duplication
  overlap_frac: 0.50
  overlap_regions: 4
  overlap_region_rate: 0.30
  double_emit_rate: 0.02
  # C5-04 wholesale duplication.  Not fitted against a fire rate: a fifth of a
  # page's regions repeating another at the same place is a broken detector at
  # any threshold, and on real output the check fires on nothing.
  duplicate_region_rate: 0.20

  # C6 buckets.  C6-01 runs only against grids that qualify as tables under
  # validation/tables.py -- on a random sample 90% of the "missed tables" a
  # strong detector was charged with were charts, headers or framed prose.
  grid_cover: 0.5
  media_text_lines: 5
  media_graphic_frac: 0.15
  media_max_text_frac: 0.18
  table_min_lines: 6
  # C6-02 consults config/table_model.json below this score.  0.05 is the point
  # where "certainly not a table" is wrong 0.7% of the time, measured out of fold
  # and held out by document -- see docs/validation-experiments.md, E6.
  table_score_floor: 0.05
  # A filled cluster scoring at or above this is the document's own content, not
  # a figure, so its glyph lines go back into the body the coverage family reads
  # and `figure_areas` stops calling it a figure.  config/graphic_model.json;
  # E7.  Out of fold and held out by document, 0.80 recovers 1875 of the 2297
  # wrongly held glyph lines and moves 67 that belong to a figure -- 28 to 1.
  # 0.90 recovers 1153 with none wrong, if a corpus needs that.
  graphic_content_floor: 0.80
  discard_body_lines: 3
  discard_line_rate: 0.15

  # C7 sanity
  out_of_bounds: 0.02
  page_dominating: 0.85
  coverage_floor: 0.40
  aspect_ratio: 60.0
