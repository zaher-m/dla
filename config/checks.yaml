# Thresholds for the validation checks.
#
# Every value here is data, not code: fitted against a corpus, dated, and
# recorded with the sample it was fitted on.  `fitted: no` means the value is a
# starting guess and has not yet been measured.
version: 1

# --- C0: PSR trust and page routing --------------------------------------
c0:
  # C0-01 no text layer at all
  min_chars: 1
  # C0-02 a text layer too thin to be the page's real content
  sparse_max_lines: 5
  sparse_min_ink: 0.15
  # C0-03 text painted invisibly or in the background colour
  invisible_frac: 0.30
  # C0-04 an OCR layer sitting under a full-page scan
  ocr_lines_in_image: 0.60
  ocr_image_area: 0.50
  # C0-06 characters that decoded to nothing usable
  undecodable_frac: 0.20
  # C0-07 one "line" per glyph: broken font subsetting
  frag_max_chars_per_span: 1
  frag_min_spans: 200
  # C0-10 text converted to vector outlines: dense vector ink, almost no glyphs
  outline_vector_ink: 0.20
  outline_max_glyph: 0.05
  # C0-08 text direction.  Decided per DOCUMENT, not per page: a statistical
  # table page inside an Arabic report is 8% Arabic characters and still reads
  # right to left.  Fitted on 895 pages / 28 documents -- the corpus separates
  # at 0.000 vs >=0.181 aggregate, so 0.05 sits in a wide empty gap.
  rtl_frac: 0.20              # page-level, diagnostic only
  doc_rtl_aggregate: 0.05     # share of all characters in the document
  doc_rtl_max_page: 0.50      # or any single page this Arabic
  doc_min_chars: 200          # below this the document cannot vote; direction unknown
  # C0-09 glyphs drawn outside the visible area
  clipped_frac: 0.05

# --- Tier 1: what blocks a page ------------------------------------------
#
# Fitted on 29 benchmark pages x 53 systems (1,546 pairs) against the PSR
# reference layout, at roughly the 75th percentile of the twelve leading
# systems.  That places a page relative to what the corpus actually produces
# and keeps the escalation rate near the 12-20% budget.
#
# It does NOT establish a false-accept rate: without annotated pages there is
# nothing to be wrong against.  These are holding values, to be refitted for
# precision at 80% recall of consequential errors the moment gold data exists.
#
# Grouping precision and order tau are deliberately absent.  Both compare
# against a heuristic reference and both largely measure granularity, so they
# are recorded as features and never block.
compare:
  orphan_rate: 0.12               # share of glyph lines in no region at all
  cross_merge_rate: 0.25          # grouped line pairs spanning a column, table or figure boundary
  bucket_move_rate: 0.35          # of lines the reference can vouch for, share sent to the wrong store
  excess_band_transitions: 2
  order_inversions: 2      # column changes beyond what the page structure allows

# --- C1-C8: the deterministic checks -------------------------------------
#
# Fitted on a uniform random sample of 120 pages (seed 7) from 35 documents,
# scored against 3 systems = 360 (system, page) pairs.  Random rather than
# stratified on purpose: the benchmark's 29 pages were chosen to be hard, so
# rates measured there describe the hard end of the corpus, not the corpus.
#
# As with the compare thresholds these bound the escalation rate, they do not
# establish a false-accept rate.  That needs annotated pages.
#
# Verification status, from rendering findings and looking at them.  Every check
# here was rendered through `validation.inspect`, which routes pages the same way
# the pipeline does -- an earlier version of that tool did not, and showed
# findings the pipeline would never emit.
#
#   verified, real                    C1-03
#   verified, false positives fixed   C1-07 C2-01 C4-02 C5-01 C5-03
#                                     C6-01 C6-05 C6-06
#   verified, demoted to advisory     C2-06 C3-01
#   fires zero times after fixing the column bands   C3-02 C4-03 C7-01 C7-04
#   still not rendered                C1-01 C1-02 C1-04 C1-05 C1-06 C3-05
#                                     C6-04 C7-03 C7-05
#
# Of the nine checks examined closely, eight were substantially wrong.  Treat
# the last group as unverified, not as working.
checks:
  # C1 coverage.  Margin lines are excluded: content in the top/bottom 8% is
  # running furniture the pipeline discards anyway, and it was 22% of all
  # uncovered lines.
  margin_band: 0.08
  orphan_line_rate: 0.12
  orphan_area_rate: 0.12
  orphan_cluster: 6
  orphan_in_column_rate: 0.12
  orphan_column_min_lines: 20
  footnote_band: 0.12
  footnote_lines: 4
  graphic_miss_area: 0.02
  graphic_miss_count: 2

  # C2 boundaries
  line_cut_rate: 0.15
  # a cut is horizontal: area coverage cannot separate a real split from
  # diacritics overflowing a correct boundary
  cut_min: 0.15
  cut_max: 0.85

  # C3 columns
  gutter_cover: 0.6
  band_span: 0.2
  band_imbalance: 0.85

  # C4 order
  excess_band_transitions: 2
  order_inversions: 2

  # C5 duplication
  overlap_frac: 0.50
  overlap_regions: 4
  overlap_region_rate: 0.30
  double_emit_rate: 0.02

  # C6 buckets.  C6-01 runs only against grids that qualify as tables under
  # validation/tables.py -- on a random sample 90% of the "missed tables" a
  # strong detector was charged with were charts, headers or framed prose.
  grid_cover: 0.5
  media_text_lines: 5
  media_graphic_frac: 0.15
  discard_body_lines: 3
  discard_line_rate: 0.15

  # C7 sanity
  out_of_bounds: 0.02
  page_dominating: 0.85
  coverage_floor: 0.40
  aspect_ratio: 60.0
