  # ---------------- DocLayNet YOLO checkpoints from other trainers --------
  # Three questions the hantian/yolo-doclaynet rows above cannot answer on
  # their own, each asked here as a controlled pair rather than as another
  # leaderboard entry:
  #
  #   * does the DocLayNet **v1.2** revision change anything?  Armaggheddon's
  #     checkpoints are the only public ones trained on v1.2.
  #   * does the architecture matter at fixed data?  Armaggheddon published
  #     YOLO11 and YOLO26 trained on exactly the same v1.2 split.
  #   * does the *trainer* matter at fixed data and architecture?  moured (KIT,
  #     the RoDLA group) trained YOLOv11x on DocLayNet v1 independently.
  - id: yolo_v12.armaggheddon_yolo26m
    repo: Armaggheddon-yolo-doc-layout
    display: "Armaggheddon · YOLO26-M (DocLayNet v1.2)"
    env: yolo
    adapter: yolo_doclaynet
    taxonomy: doclaynet
    input: image_300dpi
    config: {repo_id: "Armaggheddon/yolo26-document-layout",
             weights: "yolo26m_doc_layout.pt", imgsz: 1024, conf: 0.25, iou: 0.45,
             architecture: "YOLO26-M", training_set: "DocLayNet v1.2"}

  - id: yolo_v12.armaggheddon_yolo11m
    repo: Armaggheddon-yolo-doc-layout
    display: "Armaggheddon · YOLO11-M (DocLayNet v1.2)"
    env: yolo
    adapter: yolo_doclaynet
    taxonomy: doclaynet
    input: image_300dpi
    config: {repo_id: "Armaggheddon/yolo11-document-layout",
             weights: "yolo11m_doc_layout.pt", imgsz: 1024, conf: 0.25, iou: 0.45,
             architecture: "YOLO11-M", training_set: "DocLayNet v1.2"}

  - id: moured.yolov11x_doclaynet
    repo: moured-YOLOv11-DLA
    display: "moured (KIT) · YOLOv11-X (DocLayNet)"
    env: yolo
    adapter: yolo_doclaynet
    taxonomy: doclaynet
    input: image_300dpi
    config: {weights: "yolov11x_best.pt", imgsz: 1024, conf: 0.25, iou: 0.45,
             weights_url: "https://github.com/moured/YOLOv11-Document-Layout-Analysis/releases/download/doclaynet_weights/yolov11x_best.pt",
             architecture: "YOLOv11-X", training_set: "DocLayNet"}

  # ---------------- kraken blla (RTL-aware baseline segmentation) ----------
  # The only system here with an explicit text-direction parameter instead of a
  # built-in left-to-right assumption, and the closest available stand-in for
  # the pixelwise segmentation Eynollah was supposed to provide.  Three runs:
  # lines with the correct RTL direction, the same with LTR so the effect of
  # the setting is measured rather than assumed, and the model's own region
  # head emitted verbatim.  Line runs are *line-level* granularity -- each
  # region is one text line -- and are labelled as such.
  - id: kraken.blla_lines_rtl
    repo: kraken
    display: "kraken blla · line polygons (right-to-left)"
    env: kraken
    adapter: kraken_blla
    taxonomy: kraken
    input: image_300dpi
    config: {emit: lines, text_direction: horizontal-rl}

  - id: kraken.blla_lines_ltr
    repo: kraken
    display: "kraken blla · line polygons (left-to-right)"
    env: kraken
    adapter: kraken_blla
    taxonomy: kraken
    input: image_300dpi
    config: {emit: lines, text_direction: horizontal-lr}

  - id: kraken.blla_regions
    repo: kraken
    display: "kraken blla · region head, verbatim"
    env: kraken
    adapter: kraken_blla
    taxonomy: kraken
    input: image_300dpi
    config: {emit: regions, text_direction: horizontal-rl}
